{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Fabricantes</h2>

    <a href="/fabricante/add/" class="btn btn-success">

        Novo Fabricante

    </a>

    <br><br>

    <table class="table table-striped">

        <tr>

            <th>ID</th>

            <th>Fabricante</th>

            <th>Ações</th>

        </tr>

        {% for fabricante in fabricantes %}

        <tr>

            <td>{{ fabricante.id }}</td>

            <td>{{ fabricante.Fabricante }}</td>

            <td>

                <a class="btn btn-warning" href="/fabricante/edit/{{fabricante.id}}/">

                    Editar

                </a>

                <a class="btn btn-danger" href="/fabricante/delete/{{fabricante.id}}/">

                    Excluir

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
