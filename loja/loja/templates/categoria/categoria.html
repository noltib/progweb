{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Categorias</h2>

    <a href="/categoria/add/" class="btn btn-success">
        Nova Categoria
    </a>

    <br><br>

    <table class="table table-bordered">

        <tr>

            <th>ID</th>

            <th>Categoria</th>

            <th>Ações</th>

        </tr>

        {% for categoria in categorias %}

        <tr>

            <td>{{ categoria.id }}</td>

            <td>{{ categoria.Categoria }}</td>

            <td>

                <a class="btn btn-warning" href="/categoria/edit/{{categoria.id}}/">

                    Editar

                </a>

                <a class="btn btn-danger" href="/categoria/delete/{{categoria.id}}/">

                    Excluir

                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
