{% extends "base.html" %}

{% block content %}

<div class="container">

    <h2>Nova Categoria</h2>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Categoria</label>

            <input type="text" name="Categoria" class="form-control">

        </div>

        <br>

        <button class="btn btn-success">

            Salvar

        </button>

    </form>

</div>

{% endblock %}
